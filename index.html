  <!-- Prevent flash of wrong theme -->
  <script>
    (function () {
      var saved = localStorage.getItem('darkMode');
      var dark  = saved !== null ? saved === 'true' : true;
      if (dark) document.documentElement.classList.add('dark-mode');
    })();
  </script>
</head>
